name: Check courses

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run textlint
      - run: npm run check:devcontainer
      - run: npm run check:wslc
      - run: npm run check:access-log
      - run: npm run test:access-log
      - run: npm run check:security-log
      - run: npm run test:security-log
      - run: npm run check:monitoring
      - run: npm run test:monitoring
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual Compose model
        run: python3 scripts/check-monitoring-compose.py
      - name: Build and test disposable Compose lab
        run: python3 scripts/test-compose-monitoring.py
  access-log-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Loki, Grafana, Alloy and alert notifications
        run: python3 -B scripts/test-access-log-compose.py
  security-log-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test authentication, path investigation and notifications
        run: python3 -B scripts/test-security-log-compose.py
